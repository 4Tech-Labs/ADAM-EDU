name: ci

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
      GEMINI_API_KEY: ci-dummy-key
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev
        working-directory: backend

      - name: Run backend tests
        run: uv run --directory backend pytest -q

  backend-typecheck:
    name: backend-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        run: uv sync --dev
        working-directory: backend

      - name: Run mypy
        run: uv run --directory backend mypy src

  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run frontend lint
        run: pnpm --dir frontend run lint

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run frontend build
        run: pnpm --dir frontend run build

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run frontend tests
        run: pnpm --dir frontend run test

  # Continuous deployment to Cloud Run.
  # Runs ONLY on push to the `deploy` branch, and ONLY after every test job above
  # is green (the `needs:` gate). Pushes to `main` run the tests but skip this job
  # (the `if:` guard), so the team can keep merging to `main` without triggering a
  # deploy. To ship: merge `main` into `deploy` and push.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [backend-test, backend-typecheck, frontend-lint, frontend-build, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-west1
      IMAGE: us-west1-docker.pkg.dev/gen-lang-client-0145484488/adam-edu/public-api
      RUNTIME_SA: adam-run@gen-lang-client-0145484488.iam.gserviceaccount.com
      # Public frontend config — the anon key is public by design (it already ships
      # inside the SPA bundle), so it is safe to bake at build time here.
      VITE_SUPABASE_URL: https://pdnbjsrxgvxstjcqpxde.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_6Lds9FCwSqykixvDO1wwsg__I5MUX7F
      VITE_AUTH_CALLBACK_URL: https://adamcampus.com/auth/callback
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Authenticate to Google Cloud (Workload Identity, keyless)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/1039937714231/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-deployer@gen-lang-client-0145484488.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build image (frontend baked with VITE_* build-args)
        run: |
          docker build -f Dockerfile \
            --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-arg VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            --build-arg VITE_AUTH_CALLBACK_URL="$VITE_AUTH_CALLBACK_URL" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Push image (immutable SHA tag)
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy to Cloud Run
        run: |
          # NODE_MODEL_OVERRIDES is JSON (contains commas) → use gcloud's custom '@' delimiter
          # (^@^) for --set-env-vars so its value is not split on the JSON's internal commas.
          gcloud run deploy public-api \
            --image="$IMAGE:$GITHUB_SHA" \
            --region="$REGION" \
            --service-account="$RUNTIME_SA" \
            --command=uvicorn \
            --args="shared.app:app,--host,0.0.0.0,--port,8000" \
            --port=8000 \
            --ingress=all \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=4 \
            --no-cpu-throttling \
            --memory=2Gi --cpu=2 --timeout=3600 \
            --set-env-vars='^@^ENVIRONMENT=production@SUPABASE_URL=https://pdnbjsrxgvxstjcqpxde.supabase.co@CORS_ALLOWED_ORIGIN=https://adamcampus.com@OPENROUTER_REASONING_EFFORT=high@OPENROUTER_REASONING_MAX_TOKENS=16000@NODE_MODEL_OVERRIDES={"schema_designer":"z-ai/glm-5.2","m3_content_generator":"z-ai/glm-5.2","m3_questions_generator":"z-ai/glm-5.2","m5_content_generator":"z-ai/glm-5.2","m5_questions_generator":"z-ai/glm-5.2","m4_content_generator":"google/gemini-3.1-pro-preview"}' \
            --set-secrets="DATABASE_URL=adam-database-url:latest,GEMINI_API_KEY=adam-gemini-api-key:latest,SUPABASE_SERVICE_ROLE_KEY=adam-supabase-service-role-key:latest,OPENROUTER_API_KEY=adam-openrouter-api-key:latest"

      # Advance the floating :latest tag ONLY after a successful deploy, so :latest
      # never points at an image that failed to roll out. The deploy itself is
      # pinned to the immutable :$GITHUB_SHA above.
      - name: Tag :latest after successful deploy
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
